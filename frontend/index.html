<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>What Beats Rock?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>🪨 What Beats Rock?</h1>

  <div class="persona-toggle">
    <label for="persona">Host Persona:</label>
    <select id="persona">
      <option value="default">Default</option>
      <option value="cheery">Cheery</option>
      <option value="serious">Serious</option>
    </select>
  </div>

  <div class="game-box">
    <input type="text" id="guessInput" placeholder="Type your guess here" />
    <button onclick="submitGuess()">Guess</button>
    <p id="responseMsg"></p>
    <p id="scoreDisplay">Score: 0</p>
    <p id="globalCount"></p>
    <p>📝 Last 5 guesses: <span id="guessHistory">Rock</span></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
